name: AI Mini Drama Factory

on:
  workflow_dispatch:

jobs:
  create-drama:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate drama
        run: python drama_engine.py

      - name: Show generated story
        run: cat story.json

      - name: Save story
        uses: actions/upload-artifact@v4
        with:
          name: generated-drama
          path: story.json
